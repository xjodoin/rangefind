<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rangefind OSM Place Search</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <header class="panel-header">
      <h1>Rangefind OSM Search</h1>
      <p id="indexMeta">Loading index…</p>
    </header>
    <div class="search-box">
      <input id="queryInput" type="search" placeholder="Search a place or address…" autocomplete="off" autofocus>
      <ul id="suggestList" hidden></ul>
    </div>
    <label class="area-toggle">
      <input id="areaToggle" type="checkbox" checked>
      Search visible map area
    </label>
    <p id="statusLine"></p>
    <ul id="resultList"></ul>
    <p id="rqaAttribution" class="data-attribution" hidden>
      Québec civic addresses: <a href="https://www.donneesquebec.ca/recherche/dataset/referentiel-quebecois-des-adresses">MRNF — RQA</a>,
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
    </p>
  </aside>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
