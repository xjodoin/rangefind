name: Publish mkdocs-rangefind to PyPI

# Manual dispatch only — the plugin versions independently of the npm
# packages. Auth uses PyPI Trusted Publishing (OIDC): configure a (pending)
# publisher on pypi.org for project `mkdocs-rangefind`:
#   Owner:      xjodoin
#   Repository: rangefind
#   Workflow:   publish-mkdocs.yml
# PyPI supports pending publishers, so this works for the first release too.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The plugin's end-to-end test queries the built index through the
      # rangefind Node runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build integrations/mkdocs-rangefind

      - name: Run plugin tests
        run: |
          python -m pip install integrations/mkdocs-rangefind mkdocs pytest
          python -m pytest integrations/mkdocs-rangefind/test -q

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/mkdocs-rangefind/dist
