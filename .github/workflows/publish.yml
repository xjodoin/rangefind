name: Publish to npm

# Publishes the package when a GitHub Release is published (draft a release
# for a v* tag to trigger it), or on manual dispatch.
#
# Auth uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is stored.
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   Provider: GitHub Actions
#   Repository: xjodoin/rangefind
#   Workflow:   publish.yml
#   Environment: (leave blank)
#
# Fallback to a token instead of OIDC: add an `NPM_TOKEN` repo secret and set
#   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
# on the publish step; the `id-token` permission still enables provenance.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing (OIDC) needs a recent npm CLI.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run test:all
      - run: npm test --workspaces

      # Guard: the tag must match the package version so a release can't
      # publish a mismatched version.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      # Publishes the core package and every workspace plugin, skipping
      # versions already on the registry — re-runs are idempotent, and
      # plugins version independently of the core.
      #
      # First publish of a NEW package cannot use OIDC (npm returns 404 —
      # trusted publishers only exist on existing packages): add an npm
      # granular token with package-create permission as the NPM_TOKEN
      # secret for that run, then configure the package's trusted publisher
      # and delete the token. When the secret is absent, the placeholder
      # keeps setup-node's default so OIDC handles existing packages.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
        run: |
          FAILED=""
          for dir in . packages/docusaurus-plugin-rangefind packages/eleventy-plugin-rangefind packages/rangefind-astro packages/rangefind-mcp; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            VERSION="$(node -p "require('./$dir/package.json').version")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on the registry — skipping"
              continue
            fi
            echo "Publishing $NAME@$VERSION"
            # Attempt every package even when one fails (a new package's
            # first publish needs a token bootstrap) — collect failures.
            if ! (cd "$dir" && npm publish --provenance --access public); then
              echo "::error::$NAME@$VERSION publish command failed"
              FAILED="$FAILED $NAME@$VERSION"
              continue
            fi
            # npm exits 0 on warnings (e.g. a private flag silently skips
            # the publish) — trust only the registry.
            CONFIRMED=""
            for attempt in 1 2 3 4 5; do
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION confirmed on the registry"
                CONFIRMED=1
                break
              fi
              sleep 10
            done
            if [ -z "$CONFIRMED" ]; then
              echo "::error::$NAME@$VERSION did not appear on the registry after publish"
              FAILED="$FAILED $NAME@$VERSION"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed packages:$FAILED"
            exit 1
          fi
